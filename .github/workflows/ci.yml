name: ci

# Two jobs, split by what each mode can prove:
#   static  — nm/readelf/ldd only. No network, no Tor. Every PR/push.
#   dynamic — needs egress + a Tor daemon. Scheduled and manual only.
# Both end by running tests/leak/run.sh, whose ci_gate rows fail when a
# documented verdict changes in EITHER direction (see tests/leak/README.md).

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: make

      - name: build-time assertions (incl. DNS taxonomy)
        run: make check

      - name: leak harness (static)
        run: ./tests/leak/run.sh --static

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-results-static
          path: |
            tests/leak/results.jsonl
            tests/leak/results.md
          if-no-files-found: error

  dynamic:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: install Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo systemctl start tor 2>/dev/null || sudo tor &
          # wait for the SOCKS port the shim dials (torx.h: TORX_PORT default)
          for i in $(seq 1 30); do
            if exec 3<>/dev/tcp/127.0.0.1/9050 2>/dev/null; then exec 3>&-; break; fi
            sleep 1
          done

      - name: build
        run: make

      - name: leak harness (dynamic)
        run: ./tests/leak/run.sh --dynamic

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-results-dynamic
          path: |
            tests/leak/results.jsonl
            tests/leak/results.md
          if-no-files-found: error
