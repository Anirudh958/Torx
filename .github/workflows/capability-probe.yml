name: capability-probe

# THROWAWAY — answers docs/harness.md §6.1 exactly once: can a hosted
# runner build a boundary? Read the JSON out of the job log (or the API),
# record the answer in docs/build-notes.md, then DELETE this file.
# It must never grow tests/enforce wiring — wiring comes after the
# measurement, not from it. No checkout: this probes the runner, not the
# repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe runner capability
        run: |
          python3 - <<'PY'
          import ctypes, errno, json, os, platform, shutil, socket, subprocess

          def sh(cmd, timeout=20):
              try:
                  p = subprocess.run(cmd, shell=True, capture_output=True,
                                     text=True, timeout=timeout)
                  return {"rc": p.returncode,
                          "out": (p.stdout + p.stderr).strip()[:300]}
              except Exception as e:
                  return {"rc": None, "out": repr(e)}

          def sysctl(path):
              try:
                  with open(path) as f:
                      return f.read().strip()
              except OSError as e:
                  return f"unreadable: {e}"

          def cap_eff():
              with open("/proc/self/status") as f:
                  for line in f:
                      if line.startswith("CapEff:"):
                          return line.split()[1]
              return None

          def bpf_probe():
              # SYS_bpf = 321 (x86_64); cmd 0 = BPF_MAP_CREATE with a
              # 16-byte all-zero attr. The errno is the measurement.
              libc = ctypes.CDLL("libc.so.6", use_errno=True)
              attr = (ctypes.c_char * 16)()
              ctypes.set_errno(0)
              r = libc.syscall(321, 0, attr, 16)
              e = ctypes.get_errno()
              return {"rc": r, "errno": e,
                      "errname": errno.errorcode.get(e, str(e))}

          def loopback():
              srv = socket.socket()
              try:
                  srv.settimeout(3)
                  srv.bind(("127.0.0.1", 0))
                  srv.listen(1)
                  port = srv.getsockname()[1]
                  cli = socket.socket()
                  cli.settimeout(3)
                  cli.connect(("127.0.0.1", port))
                  conn, _ = srv.accept()
                  conn.close()
                  cli.close()
                  return {"rc": 0}
              except OSError as e:
                  return {"rc": 1, "error": repr(e)}
              finally:
                  srv.close()

          def port_open(port):
              s = socket.socket()
              s.settimeout(2)
              try:
                  s.connect(("127.0.0.1", port))
                  return {"rc": 0}
              except OSError as e:
                  return {"rc": 1, "error": repr(e)}
              finally:
                  s.close()

          nft = shutil.which("nft") or "/usr/sbin/nft"
          ip = shutil.which("ip") or "/usr/sbin/ip"

          result = {
              "probe": "torx-capability-probe v1",
              "os": platform.platform(),
              "uid": os.getuid(),
              "cap_eff": cap_eff(),
              "tools": {t: shutil.which(t) for t in
                        ["ip", "nft", "jq", "gcc", "make", "python3",
                         "nc", "tor", "bpftool", "nsenter"]},
              "nft_path": nft,
              "nft_version": sh(f"{nft} --version"),
              "sysctl": {
                  "unprivileged_userns_clone":
                      sysctl("/proc/sys/kernel/unprivileged_userns_clone"),
                  "max_user_namespaces":
                      sysctl("/proc/sys/user/max_user_namespaces"),
                  "unprivileged_bpf_disabled":
                      sysctl("/proc/sys/kernel/unprivileged_bpf_disabled"),
              },
              "userns": sh("unshare -Urn true"),
              "veth_in_userns": sh(
                  f"unshare -Urn {ip} link add v0 type veth peer name v1"),
              "nft_in_userns": sh(
                  f"unshare -Urn sh -c '{nft} add table inet probe; "
                  f"{nft} list ruleset'"),
              "nft_host_nocaps": sh(f"{nft} list ruleset"),
              "bpf": bpf_probe(),
              "loopback": loopback(),
              "tor_socks_port": port_open(9050),
          }
          js = json.dumps(result, indent=2, sort_keys=True)
          print("PROBE_JSON=" + json.dumps(result, sort_keys=True))
          print(js)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write("```json\n" + js + "\n```\n")
          PY
